<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reviews</title>
  <style>
body {
  margin: 0;
  padding: 0;
  background-image: url(cybersigilangel.jpg);
  font-family: 'Sorts Mill Goudy', serif;
  font-size: 0.95rem;
  color: var(--ink);
  position: relative;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('cybersigilangel.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: blur(1.5px);
  transform: scale(1.05);
  z-index: -1;
}
    .box {
      background: white;
      border: 2px solid black;
      box-sizing: border-box;
    }

    #favorites {
      width: 200px;
      height: 360px;
      padding: 20px 10px;
      text-align: center;
    }

    #favorites h2,
    #reviews h2 {
      margin: 0 0 10px;
      font-weight: normal;
    }

    .selector button {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 1em;
      cursor: pointer;
    }

    #reviews {
      width: 800px;
      height: 500px;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
    }

    #reviews h2 {
      text-align: center;
    }

    .reviews-body {
      flex: 1;
      display: flex;
    }

    #review-list {
      flex: 1;
      padding: 20px;
    }

    #filter {
      width: 250px;
      padding: 20px;
      border-left: 2px solid black;
      box-sizing: border-box;
    }

    #filter input {
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div id="favorites" class="box">
    <h2>favorites</h2>
    <div class="selector">
      <button id="prev">&lt;</button>
      <span id="category">characters</span>
      <button id="next">&gt;</button>
    </div>
  </div>

  <div id="reviews" class="box">
    <h2>reviews</h2>
    <div class="reviews-body">
      <div id="review-list">(section for reviews)</div>
      <div id="filter">
        <input type="text" placeholder="search reviews">
      </div>
    </div>
  </div>

  <script>
    const categories = ["characters", "games", "movies", "books", "music"];
    let index = 0;
    const label = document.getElementById("category");

    document.getElementById("prev").onclick = () => {
      index = (index - 1 + categories.length) % categories.length;
      label.textContent = categories[index];
    };

    document.getElementById("next").onclick = () => {
      index = (index + 1) % categories.length;
      label.textContent = categories[index];
    };
  </script>

</body>
</html>
