<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Under Construction</title>
<style>
    body {
        background: #c3c9d3 url('https://sadhost.neocities.org/images/tiles/num.gif') repeat; /* You can replace with your bg */
        font-family: "Georgia", serif;
        color: #2c2c40;
        text-align: center;
        margin: 0;
        padding: 0;
    }
    .container {
        max-width: 600px;
        margin: 80px auto;
        padding: 20px;
        border: 8px solid #d9dde6;
        background-color: rgba(255,255,255,0.8);
        background-clip: padding-box;
        box-shadow: 0 0 12px rgba(0,0,0,0.15);
        border-image: url('https://i.imgur.com/41P3cdJ.png') 30 round; /* lace border placeholder */
    }
    h1 {
        font-size: 2em;
        margin-bottom: 0.5em;
        font-weight: normal;
        letter-spacing: 1px;
    }
    p {
        font-size: 1em;
        line-height: 1.6em;
        margin-bottom: 1.5em;
    }
    a {
        text-decoration: none;
        color: #445577;
        border-bottom: 1px dotted #445577;
    }
    a:hover {
        color: #223344;
        border-bottom: 1px solid #223344;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>this page is sleeping...</h1>
        <p>
            perhaps it is under construction, or maybe it never existed at all.<br>
            please wander back <a href="index.html">home</a> and explore other corners.
        </p>

        <img src="underconstruction.gif" alt="a gif with an anime character that says 'under construction'.">
        <p style="font-size:0.9em;color:#666;">
            made with love.
        </p>
    </div>
</body>
</html>
