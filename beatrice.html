<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rokkenjima</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
.sticker {
  position: fixed;
  width: 250px;       /* adjust size as needed */
  height: auto;       /* preserve aspect ratio */
  z-index: 3;         /* above background but below UI elements */
  pointer-events: none; /* won't block clicks */
  filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4));
}


    body {
      margin: 0;
      height: 100vh;
      background: url('shrinethings/beato.png') center/cover no-repeat fixed;
      cursor: url('cursors/goldnormal.png'), auto;
      overflow: hidden;
      font-family: 'Cinzel Decorative', 'Hiragino Mincho Pro', 'MS Mincho', serif;
      color: #f7ecd1;
      text-shadow: 0 0 2px #fff8e7, 0 0 8px rgba(180, 60, 20, 0.2);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(255, 223, 100, 0.1), rgba(0, 0, 0, 0.7));
      pointer-events: none;
      z-index: 1;
    }

    .title {
      position: fixed;
      top: 20px;
      right: 40px;
      font-size: 2.4rem;
      font-weight: bold;
      color: #f9e9c5;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0 #5c2a00, 2px 2px 0 #8b4513, 0 0 15px rgba(255, 200, 100, 0.4);
      border-bottom: 2px solid rgba(180, 50, 20, 0.6);
      padding-bottom: 5px;
      z-index: 5;
      font-variant: small-caps;
      animation: titleGlow 6s ease-in-out infinite;
    }
    @keyframes titleGlow {
      0%, 100% { text-shadow: 1px 1px 0 #5c2a00, 2px 2px 0 #8b4513, 0 0 15px rgba(255, 200, 100, 0.4); }
      50% { text-shadow: 1px 1px 0 #8b4513, 2px 2px 0 #a0522d, 0 0 25px rgba(255, 180, 120, 0.6); }
    }

    .music-box {
      font-family: 'Times New Roman', serif;
      text-align: center;
      background: linear-gradient(180deg, rgba(90, 50, 20, 0.4), rgba(40, 20, 10, 0.7));
      color: #f9e8c3;
      position: fixed;
      bottom: 30px;
      right: 40px;
      width: 320px;
      border: 2px solid #b58b4e;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(160, 80, 20, 0.8), inset 0 0 10px rgba(255, 220, 170, 0.1);
      backdrop-filter: blur(8px);
      z-index: 10;
      padding: 12px;
      background-blend-mode: overlay;
    }
    .music-box audio { width: 90%; filter: drop-shadow(0 0 3px #b58b4e); }

    .runes {
      position: fixed;
      right: 60px;
      top: 120px;
      width: 200px;
      height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      z-index: 2;
    }
    .rune {
      font-size: 1.6rem;
      opacity: 0.9;
      color: #f7d8a6;
      text-shadow: 1px 1px 0 #7a3b1c, 0 0 6px rgba(255, 230, 150, 0.7);
      animation: float 6s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.9; }
      50% { transform: translateY(-15px) scale(1.05); opacity: 1; }
    }

    .butterfly {
      position: fixed;
      width: 26px;
      height: 26px;
      background: radial-gradient(circle, rgba(255, 200, 80, 0.9) 25%, rgba(255, 0, 0, 0.2) 85%);
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
      animation: flutter 1.6s ease-out forwards;
      filter: drop-shadow(0 0 8px rgba(255, 190, 100, 0.8));
    }
    @keyframes flutter {
      0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(-15px, -25px) scale(1.3) rotate(25deg); }
      100% { opacity: 0; transform: translate(25px, -70px) scale(0.7) rotate(-40deg); }
    }

    .sparkle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: radial-gradient(circle, #ffb84d, #ff0022);
      border-radius: 50%;
      opacity: 0;
      animation: sparkle 3s ease-in-out infinite;
      mix-blend-mode: screen;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.6); }
    }

    .offer-icon {
      position: fixed;
      left: 280px;
      top: 45%;
      transform: translateY(-50%);
      width: 80px;
      height: 80px;
      background: url('shrinethings/thebutterfly-removebg-preview.png') center/contain no-repeat;
      cursor: pointer;
      z-index: 20;
      transition: transform 0.3s ease;
    }
    .offer-icon:hover {
      transform: translateY(-50%) scale(1.1) rotate(5deg);
      filter: drop-shadow(0 0 8px gold);
    }

    .tooltip {
      position: fixed;
      left: 110px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(40, 20, 10, 0.85);
      border: 1px solid #b58b4e;
      padding: 6px 10px;
      border-radius: 8px;
      color: #f9e8c3;
      font-size: 0.9rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 21;
    }
    .offer-icon:hover + .tooltip { opacity: 1; }

    .offering-container {
      position: fixed;
      bottom: -40vh;
      left: 0;
      width: 100%;
      height: 10vh;
      border-top: 3px solid #b58b4e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 30;
      overflow: hidden;
      transition: bottom 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .offering-container::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('shrinethings/woodgraintexture.webp');
      filter: blur(4px);
      transform: scale(1.05);
      z-index: -1;
    }

    .offering-container.active {
      bottom: 0;
    }

    .witch-wrapper {
      position: absolute;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 31;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .witch-wrapper.active {
      display: flex;
      opacity: 1;
    }

    .witch-area {
      width: 250px;
      height: 300px;
      background: url('shrinethings/Bea4_waraia7.webp') center/cover no-repeat;
      border: 2px solid #b58b4e;
      border-radius: 10px;
    }

    .speech-bubble {
      position: relative;
      background: rgba(255, 250, 240, 0.9);
      color: #2c1a0c;
      padding: 8px 14px;
      border-radius: 12px;
      max-width: 200px;
      text-align: center;
      font-style: italic;
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
      margin-bottom: 10px;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: rgba(255, 250, 240, 0.9) transparent transparent transparent;
    }

    .items-row {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .offering-item {
      width: 64px;
      height: 64px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: grab;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="title">my beloved golden witch &lt;3 </div>

  <div class="runes">
    <div class="rune">✶</div>
    <div class="rune">✦</div>
    <div class="rune">✺</div>
    <div class="rune">❂</div>
    <div class="rune">✧</div>
  </div>

  <div class="music-box">
    Organ short #600 million in C minor
    <audio preload="auto" controls src="https://files.catbox.moe/tv29re.mp3"></audio>
  </div>

  <div class="offer-icon" id="offerIcon"></div>
  <div class="tooltip">leave an offering</div>

  <div class="witch-wrapper" id="witchWrapper">
    <div class="speech-bubble" id="reactionBubble">Drag an item to her...</div>
    <div class="witch-area" id="witchArea"></div>
  </div>

  <div class="offering-container" id="offeringContainer">
    <div class="items-row">
      <div class="offering-item" draggable="true" style="background-image: url('shrinethings/offerings/chailatte.png');" data-reaction="&quot;I'm glad to see they still appreciate foreign teas in your time.&quot;" data-sprite="shrinethings/Bea_hajiraia2.webp"></div>
      <div class="offering-item" draggable="true" style="background-image: url('https://64.media.tumblr.com/40efba5ed586cbec04aa467be515dc21/65b3bcdfa512cd8d-9a/s1280x1920/5ac56d305fed15eeb59cfccae89061241bc6243c.pnj');" data-reaction="&quot;Ah... the fruit of old promises.&quot;" data-sprite="shrinethings/Bea_housina2.webp"></div>
      <div class="offering-item" draggable="true" style="background-image: url('shrinethings/offerings/battlerplush.png');" data-reaction="&quot;Kihihihihi~ What a pathetic little effigy.&quot;" data-sprite="shrinethings/Bea_fukigena1.webp"></div>
      <div class="offering-item" draggable="true" style="background-image: url('shrinethings/offerings/tiramisu.png');" data-reaction="&quot;You went all the way to the south of France for this? How extravagant.&quot;" data-sprite="shrinethings/Bea_iiwakea1.webp"></div>
      <div class="offering-item" draggable="true" style="background-image: url('shrinethings/offerings/weedblunt.png');" data-reaction="&quot;Hoh... you're a bold one, aren’t you?&quot;" data-sprite="shrinethings/Bea_akuwaraia2.webp"></div>
      <div class="offering-item" draggable="true" style="background-image: url('https://i.pinimg.com/736x/b3/14/70/b31470320285dd2ca754858ca65bf347.jpg');" data-reaction="&quot;....&quot;" data-sprite="shrinethings/Bea_housina2.webp"></div>
    </div>
  </div>

  <script>
    document.addEventListener('mousemove', e => {
      const butterfly = document.createElement('div');
      butterfly.classList.add('butterfly');
      butterfly.style.left = e.pageX + 'px';
      butterfly.style.top = e.pageY + 'px';
      document.body.appendChild(butterfly);
      setTimeout(() => butterfly.remove(), 1600);
    });

    for (let i = 0; i < 20; i++) {
      const s = document.createElement('div');
      s.classList.add('sparkle');
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.animationDelay = Math.random() * 3 + 's';
      document.body.appendChild(s);
    }

    const offerIcon = document.getElementById('offerIcon');
    const offeringContainer = document.getElementById('offeringContainer');
    const witchWrapper = document.getElementById('witchWrapper');

    offerIcon.addEventListener('click', () => {
      const isActive = offeringContainer.classList.toggle('active');
      if (isActive) {
        witchWrapper.classList.add('active');
      } else {
        witchWrapper.classList.remove('active');
      }
    });

    const witchArea = document.getElementById('witchArea');
    const reactionBubble = document.getElementById('reactionBubble');
    const defaultSprite = 'shrinethings/Bea4_waraia7.webp';
    let revertTimer = null;

    document.querySelectorAll('.offering-item').forEach(item => {
      item.addEventListener('dragstart', e => {
        e.dataTransfer.setData('reaction', item.dataset.reaction);
        e.dataTransfer.setData('sprite', item.dataset.sprite);
      });
    });

    witchArea.addEventListener('dragover', e => {
      e.preventDefault();
      witchArea.style.filter = 'drop-shadow(0 0 10px gold)';
    });

    witchArea.addEventListener('dragleave', () => {
      witchArea.style.filter = 'none';
    });

    witchArea.addEventListener('drop', e => {
      e.preventDefault();
      witchArea.style.filter = 'none';
      const reaction = e.dataTransfer.getData('reaction');
      const sprite = e.dataTransfer.getData('sprite');
      reactionBubble.innerHTML = reaction;
      witchArea.style.backgroundImage = `url('${sprite}')`;
      if (revertTimer) clearTimeout(revertTimer);
      revertTimer =
 setTimeout(() => {
        witchArea.style.backgroundImage = `url('${defaultSprite}')`;
        reactionBubble.textContent = 'Drag an item to her...';
      }, 5000);
    });
    
  </script>
<img src="shrinethings/logo.png" class="sticker" style="top: 0vh; left: 0vw;">
<img src="shrinethings/umineko-beato.gif" class="sticker" style="top: 65vh; left: 0vw;">

</body>
</html>
